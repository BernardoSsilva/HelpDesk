name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tipos e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ticket_user
          POSTGRES_PASSWORD: ticket_password
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_user -d helpdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # O prisma.config.ts exige DATABASE_URL até para `prisma generate`.
      DATABASE_URL: postgresql://ticket_user:ticket_password@localhost:5432/helpdesk_test?schema=public
      # Banco descartável usado pelos testes de integração (as migrations são aplicadas pelo próprio teste).
      TEST_DATABASE_URL: postgresql://ticket_user:ticket_password@localhost:5432/helpdesk_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (tipos, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
